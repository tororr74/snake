<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Моя Змейка на GitHub</title>

    <style>
        body {
            background: #222;
            color: white;
            text-align: center;
            font-family: sans-serif;
        }

        canvas {
            background: #111;
            display: block;
            margin: 20px auto;
            border: 4px solid #4CAF50;
        }
    </style>
</head>

<body>

    <h1>Игра "Змейка"</h1>
    <p>Управление: стрелочки на клавиатуре</p>

    <canvas id="game" width="400" height="400"></canvas>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        const grid = 20;
        let count = 0;

        let snake = {
            x: 160,
            y: 160,
            dx: grid,
            dy: 0,
            cells: [],
            maxCells: 4
        };

        let apple = {
            x: 320,
            y: 320
        };

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min)) + min;
        }

        function loop() {
            requestAnimationFrame(loop);

            // Скорость игры
            if (++count < 6) {
                return;
            }

            count = 0;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Движение змейки
            snake.x += snake.dx;
            snake.y += snake.dy;

            // Выход за границу переносит змейку на другую сторону
            if (snake.x < 0) {
                snake.x = canvas.width - grid;
            } else if (snake.x >= canvas.width) {
                snake.x = 0;
            }

            if (snake.y < 0) {
                snake.y = canvas.height - grid;
            } else if (snake.y >= canvas.height) {
                snake.y = 0;
            }

            // Добавляем новую позицию головы
            snake.cells.unshift({
                x: snake.x,
                y: snake.y
            });

            // Удаляем хвост
            if (snake.cells.length > snake.maxCells) {
                snake.cells.pop();
            }

            // Рисуем яблоко
            ctx.fillStyle = "red";
            ctx.fillRect(
                apple.x,
                apple.y,
                grid - 1,
                grid - 1
            );

            // Рисуем змейку
            ctx.fillStyle = "green";

            snake.cells.forEach(function(cell, index) {

                ctx.fillRect(
                    cell.x,
                    cell.y,
                    grid - 1,
                    grid - 1
                );

                // Проверяем, съела ли змейка яблоко
                if (
                    cell.x === apple.x &&
                    cell.y === apple.y
                ) {
                    snake.maxCells++;

                    apple.x = getRandomInt(0, 20) * grid;
                    apple.y = getRandomInt(0, 20) * grid;
                }

                // Проверяем столкновение с собой
                for (
                    let i = index + 1;
                    i < snake.cells.length;
                    i++
                ) {
                    if (
                        cell.x === snake.cells[i].x &&
                        cell.y === snake.cells[i].y
                    ) {
                        snake.x = 160;
                        snake.y = 160;
                        snake.cells = [];
                        snake.maxCells = 4;
                        snake.dx = grid;
                        snake.dy = 0;

                        apple.x = getRandomInt(0, 20) * grid;
                        apple.y = getRandomInt(0, 20) * grid;
                    }
                }
            });
        }

        // Управление стрелками
        document.addEventListener("keydown", function(e) {

            if (e.key === "ArrowLeft" && snake.dx === 0) {
                snake.dx = -grid;
                snake.dy = 0;
            }

            else if (e.key === "ArrowUp" && snake.dy === 0) {
                snake.dy = -grid;
                snake.dx = 0;
            }

            else if (e.key === "ArrowRight" && snake.dx === 0) {
                snake.dx = grid;
                snake.dy = 0;
            }

            else if (e.key === "ArrowDown" && snake.dy === 0) {
                snake.dy = grid;
                snake.dx = 0;
            }
        });

        // Запуск игры
        requestAnimationFrame(loop);
    </script>

</body>
</html>
